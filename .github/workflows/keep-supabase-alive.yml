name: Keep Supabase Alive

on:
  schedule:
    # Läuft jeden 2. Tag um 3 Uhr UTC
    - cron: '0 3 */2 * *'
  workflow_dispatch: # erlaubt manuelles Auslösen zum Testen

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
