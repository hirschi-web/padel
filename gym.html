<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GT – Gym Tracker</title>
<style>
  :root {
    --bg:       #0F0F0F;
    --card:     #1A1A1A;
    --card2:    #242424;
    --border:   #2E2E2E;
    --accent:   #E8541A;
    --accent2:  #FF6B35;
    --green:    #22C55E;
    --yellow:   #EAB308;
    --red:      #EF4444;
    --t1:       #F5F5F5;
    --t2:       #A0A0A0;
    --t3:       #606060;
    --radius:   14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--t1); font-family: -apple-system, 'Inter', sans-serif; min-height: 100vh; }
  body { padding-bottom: env(safe-area-inset-bottom, 20px); }

  /* ── LOCK SCREEN ─────────────────────────────── */
  .lock { display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:32px 24px; gap:32px; }
  .lock-logo { font-size:48px; font-weight:800; letter-spacing:-2px; color:var(--accent); }
  .lock-sub  { font-size:15px; color:var(--t2); margin-top:-24px; }
  .lock-form { display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; }
  .lock-input { background:var(--card); border:1.5px solid var(--border); border-radius:var(--radius);
    color:var(--t1); font-size:18px; padding:16px 18px; outline:none; width:100%; }
  .lock-input:focus { border-color:var(--accent); }
  .lock-error { color:var(--red); font-size:14px; text-align:center; }

  /* ── BUTTONS ─────────────────────────────────── */
  .btn { border:none; border-radius:var(--radius); font-size:17px; font-weight:600;
    padding:16px 20px; cursor:pointer; transition: opacity .15s, transform .1s; width:100%; }
  .btn:active { transform:scale(0.97); opacity:.85; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-secondary { background:var(--card2); color:var(--t1); }
  .btn-ghost { background:transparent; color:var(--t2); border:1.5px solid var(--border); }
  .btn-green { background:var(--green); color:#000; }
  .btn-danger { background:var(--red); color:#fff; }
  .btn-sm { padding:10px 14px; font-size:15px; border-radius:var(--radius-sm); width:auto; }
  .btn-icon { width:52px; height:52px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:22px; padding:0; }

  /* ── LAYOUT ──────────────────────────────────── */
  .app { max-width:430px; margin:0 auto; padding:0 0 100px; }
  .header { padding:16px 20px 12px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; background:var(--bg); z-index:50; border-bottom:1px solid var(--border); }
  .header-title { font-size:20px; font-weight:700; }
  .header-back { font-size:17px; color:var(--accent); font-weight:600; background:none;
    border:none; cursor:pointer; padding:4px 0; }

  /* ── BOTTOM NAV ──────────────────────────────── */
  .nav { position:fixed; bottom:0; left:0; right:0; background:var(--card);
    border-top:1px solid var(--border); display:flex; z-index:100;
    padding-bottom:env(safe-area-inset-bottom, 0px); }
  .nav-item { flex:1; display:flex; flex-direction:column; align-items:center;
    gap:4px; padding:10px 0; cursor:pointer; border:none; background:none; color:var(--t3); }
  .nav-item.active { color:var(--accent); }
  .nav-icon { font-size:22px; line-height:1; }
  .nav-label { font-size:10px; font-weight:600; letter-spacing:.03em; }

  /* ── CARDS ───────────────────────────────────── */
  .card { background:var(--card); border-radius:var(--radius); padding:18px 16px;
    margin:0 16px 12px; }
  .card-title { font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--t2);
    text-transform:uppercase; margin-bottom:10px; }

  /* ── DASHBOARD ───────────────────────────────── */
  .dash-today { background:var(--card); border-radius:var(--radius); margin:16px 16px 12px;
    padding:20px 16px; border-left:4px solid var(--accent); }
  .dash-today-label { font-size:12px; color:var(--t2); font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; margin-bottom:6px; }
  .dash-today-plan { font-size:26px; font-weight:800; letter-spacing:-0.5px; }
  .dash-today-meta { font-size:14px; color:var(--t2); margin-top:4px; }

  .stats-row { display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin:0 16px 12px; }
  .stat-card { background:var(--card); border-radius:var(--radius); padding:16px 14px; }
  .stat-val  { font-size:28px; font-weight:800; letter-spacing:-1px; }
  .stat-lbl  { font-size:12px; color:var(--t2); font-weight:600; margin-top:2px; }
  .stat-sub  { font-size:11px; color:var(--t3); margin-top:1px; }
  .stat-accent { color:var(--accent); }
  .stat-green  { color:var(--green); }

  /* ── HISTORY LIST ────────────────────────────── */
  .session-item { background:var(--card); border-radius:var(--radius); margin:0 16px 10px;
    padding:16px; display:flex; flex-direction:column; gap:8px; cursor:pointer; }
  .session-item:active { opacity:.8; }
  .session-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .session-name { font-size:18px; font-weight:700; }
  .session-date { font-size:13px; color:var(--t2); }
  .session-meta { display:flex; gap:12px; flex-wrap:wrap; }
  .session-tag  { font-size:13px; color:var(--t2); }
  .feeling-dot  { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }

  /* ── ÜBUNGEN / LIBRARY ───────────────────────── */
  .filter-bar { padding:12px 16px; display:flex; gap:8px; overflow-x:auto;
    -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory; }
  .filter-bar::-webkit-scrollbar { display:none; }
  .filter-chip { background:var(--card); border:1.5px solid var(--border); border-radius:20px;
    padding:8px 14px; font-size:14px; color:var(--t2); white-space:nowrap; cursor:pointer;
    scroll-snap-align:start; flex-shrink:0; font-weight:600; }
  .filter-chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .filter-select { background:var(--card); border:1.5px solid var(--border); border-radius:var(--radius-sm);
    color:var(--t1); font-size:15px; padding:10px 12px; width:100%; outline:none; }

  .exercise-item { background:var(--card); border-radius:var(--radius); margin:0 16px 8px;
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; }
  .exercise-item:active { opacity:.8; }
  .ex-left { flex:1; }
  .ex-name { font-size:17px; font-weight:600; }
  .ex-meta { font-size:13px; color:var(--t2); margin-top:3px; }
  .ex-right { text-align:right; }
  .ex-weight { font-size:22px; font-weight:800; color:var(--accent); }
  .ex-step { font-size:12px; color:var(--t3); }
  .muscle-badge { display:inline-block; background:var(--card2); border-radius:6px;
    padding:3px 8px; font-size:12px; color:var(--t2); margin-right:4px; margin-top:4px; }

  /* ── PLAN BUILDER ────────────────────────────── */
  .plan-item { background:var(--card); border-radius:var(--radius); margin:0 16px 8px;
    padding:16px; }
  .plan-name { font-size:20px; font-weight:700; }
  .plan-meta { font-size:14px; color:var(--t2); margin-top:4px; }
  .plan-exercises { margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .plan-ex-row { background:var(--card2); border-radius:var(--radius-sm); padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; }
  .plan-ex-name { font-size:16px; font-weight:600; }
  .plan-ex-detail { font-size:13px; color:var(--t2); margin-top:2px; }
  .plan-ex-right { text-align:right; }
  .plan-ex-sets { font-size:18px; font-weight:700; color:var(--accent); }
  .plan-ex-rest { font-size:12px; color:var(--t3); }

  /* ── WORKOUT SCREEN ──────────────────────────── */
  .workout-header { background:var(--card); padding:16px 20px; margin-bottom:1px; }
  .workout-vol { font-size:13px; color:var(--t2); font-weight:700; text-transform:uppercase;
    letter-spacing:.08em; }
  .workout-vol-num { font-size:42px; font-weight:900; letter-spacing:-2px; color:var(--accent);
    line-height:1; }
  .workout-vol-unit { font-size:16px; color:var(--t2); font-weight:600; margin-left:4px; }
  .workout-meta-row { display:flex; gap:20px; margin-top:8px; }
  .workout-meta-item { display:flex; flex-direction:column; }
  .workout-meta-val  { font-size:18px; font-weight:700; }
  .workout-meta-lbl  { font-size:11px; color:var(--t3); font-weight:600; text-transform:uppercase; }

  .workout-progress { margin:0 16px 12px; }
  .progress-bar-bg { background:var(--card2); border-radius:4px; height:6px; margin-top:8px; }
  .progress-bar-fill { background:var(--accent); border-radius:4px; height:6px;
    transition:width .4s ease; }
  .progress-label { display:flex; justify-content:space-between; font-size:13px; color:var(--t2); }

  .current-exercise { background:var(--card); border-radius:var(--radius); margin:0 16px 12px;
    padding:20px 16px; border:2px solid var(--accent); }
  .curr-ex-label { font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--accent);
    text-transform:uppercase; margin-bottom:6px; }
  .curr-ex-name { font-size:26px; font-weight:800; letter-spacing:-0.5px; }
  .curr-ex-muscles { margin-top:6px; }

  .set-logger { margin:0 16px 12px; }
  .set-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .set-num { width:28px; font-size:15px; color:var(--t2); font-weight:700; flex-shrink:0; }
  .set-done { background:var(--green); color:#000; }
  .set-active { border-color:var(--accent); }

  .weight-control { background:var(--card); border-radius:var(--radius); margin:0 16px 12px;
    padding:16px; }
  .weight-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .weight-display { text-align:center; flex:1; }
  .weight-val { font-size:52px; font-weight:900; letter-spacing:-2px; color:var(--t1); line-height:1; }
  .weight-unit { font-size:18px; color:var(--t2); font-weight:600; }
  .weight-suggestion { font-size:13px; color:var(--accent); margin-top:4px; font-weight:600; }
  .weight-btn { width:64px; height:64px; border-radius:50%; font-size:28px; font-weight:700;
    border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: transform .1s; flex-shrink:0; }
  .weight-btn:active { transform:scale(.92); }
  .weight-minus { background:var(--card2); color:var(--t1); }
  .weight-plus  { background:var(--accent); color:#fff; }

  .reps-control { background:var(--card); border-radius:var(--radius); margin:0 16px 12px;
    padding:16px; }
  .reps-label { font-size:12px; font-weight:700; color:var(--t2); text-transform:uppercase;
    letter-spacing:.08em; margin-bottom:10px; }
  .reps-row { display:flex; gap:8px; flex-wrap:wrap; }
  .rep-btn { background:var(--card2); border:1.5px solid var(--border); border-radius:10px;
    color:var(--t1); font-size:20px; font-weight:700; width:56px; height:56px;
    cursor:pointer; transition: all .1s; display:flex; align-items:center; justify-content:center; }
  .rep-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .rep-btn:active { transform:scale(.93); }

  /* ── TIMER ───────────────────────────────────── */
  .timer-card { background:var(--card); border-radius:var(--radius); margin:0 16px 12px;
    padding:20px 16px; text-align:center; }
  .timer-val { font-size:56px; font-weight:900; letter-spacing:-3px; font-variant-numeric:tabular-nums; }
  .timer-label { font-size:13px; color:var(--t2); font-weight:700; text-transform:uppercase;
    letter-spacing:.08em; margin-bottom:8px; }
  .timer-active { color:var(--accent); }
  .timer-done   { color:var(--green); }
  .timer-row { display:flex; gap:8px; margin-top:12px; }

  /* ── FEELING ─────────────────────────────────── */
  .feeling-screen { padding:24px 16px; }
  .feeling-title { font-size:28px; font-weight:800; margin-bottom:8px; }
  .feeling-sub { font-size:16px; color:var(--t2); margin-bottom:28px; }
  .feeling-slider-val { font-size:72px; font-weight:900; color:var(--accent); text-align:center;
    letter-spacing:-3px; line-height:1; margin-bottom:8px; }
  .feeling-desc { text-align:center; font-size:18px; color:var(--t2); margin-bottom:24px;
    font-weight:600; }
  .feeling-slider { width:100%; height:8px; accent-color:var(--accent); cursor:pointer;
    margin-bottom:24px; }
  .feeling-note-label { font-size:14px; color:var(--t2); font-weight:600; margin-bottom:8px; }
  .feeling-note { background:var(--card); border:1.5px solid var(--border); border-radius:var(--radius);
    color:var(--t1); font-size:16px; padding:14px 16px; width:100%; outline:none;
    resize:none; font-family:inherit; }
  .feeling-note:focus { border-color:var(--accent); }

  /* ── CHARTS / HISTORY ────────────────────────── */
  .chart-bar-row { display:flex; align-items:flex-end; gap:4px; height:80px; margin-top:8px; }
  .chart-bar { flex:1; background:var(--card2); border-radius:4px 4px 0 0;
    transition:height .3s ease; position:relative; min-height:4px; }
  .chart-bar.accent { background:var(--accent); }
  .chart-labels { display:flex; gap:4px; margin-top:4px; }
  .chart-lbl { flex:1; text-align:center; font-size:10px; color:var(--t3); }

  /* ── MODAL ───────────────────────────────────── */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:200;
    display:flex; align-items:flex-end; }
  .modal-sheet { background:var(--card); border-radius:var(--radius) var(--radius) 0 0;
    padding:24px 20px 40px; width:100%; max-height:80vh; overflow-y:auto; }
  .modal-handle { width:40px; height:4px; background:var(--border); border-radius:2px;
    margin:0 auto 20px; }
  .modal-title { font-size:22px; font-weight:800; margin-bottom:16px; }

  /* ── FORM INPUTS ─────────────────────────────── */
  .form-group { margin-bottom:16px; }
  .form-label { font-size:13px; font-weight:700; color:var(--t2); text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:8px; display:block; }
  .form-input { background:var(--card2); border:1.5px solid var(--border); border-radius:var(--radius-sm);
    color:var(--t1); font-size:17px; padding:14px 14px; width:100%; outline:none; font-family:inherit; }
  .form-input:focus { border-color:var(--accent); }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form-select { background:var(--card2); border:1.5px solid var(--border); border-radius:var(--radius-sm);
    color:var(--t1); font-size:16px; padding:14px 14px; width:100%; outline:none; }

  /* ── SECTION HEADER ──────────────────────────── */
  .section-header { display:flex; justify-content:space-between; align-items:center;
    padding:20px 16px 10px; }
  .section-title { font-size:22px; font-weight:800; }
  .section-action { font-size:15px; color:var(--accent); font-weight:600;
    background:none; border:none; cursor:pointer; }

  /* ── DURATION ESTIMATE ───────────────────────── */
  .duration-card { background:linear-gradient(135deg, #1A1A1A 0%, #1E1207 100%);
    border:1px solid var(--accent)33; border-radius:var(--radius); margin:0 16px 12px;
    padding:16px; }
  .duration-main { font-size:36px; font-weight:900; color:var(--accent); letter-spacing:-1px; }
  .duration-breakdown { display:flex; gap:16px; margin-top:8px; flex-wrap:wrap; }
  .duration-item { font-size:13px; color:var(--t2); }
  .duration-item span { color:var(--t1); font-weight:700; }

  /* ── EMPTY STATE ─────────────────────────────── */
  .empty { text-align:center; padding:48px 24px; }
  .empty-icon { font-size:48px; margin-bottom:16px; }
  .empty-text { font-size:18px; font-weight:700; margin-bottom:8px; }
  .empty-sub  { font-size:15px; color:var(--t2); margin-bottom:24px; }

  /* ── PR BADGE ────────────────────────────────── */
  .pr-badge { background:var(--yellow); color:#000; font-size:11px; font-weight:800;
    padding:2px 7px; border-radius:5px; margin-left:8px; letter-spacing:.04em; }

  /* ── SETS TABLE ──────────────────────────────── */
  .sets-table { width:100%; border-collapse:collapse; }
  .sets-table th { font-size:11px; color:var(--t3); font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; padding:6px 0; text-align:left; border-bottom:1px solid var(--border); }
  .sets-table td { padding:10px 0; border-bottom:1px solid var(--border)55; font-size:16px; }
  .sets-table td:last-child { text-align:right; }

  /* ── UTIL ────────────────────────────────────── */
  .mt-8  { margin-top:8px; }
  .mt-12 { margin-top:12px; }
  .mt-16 { margin-top:16px; }
  .mb-12 { margin-bottom:12px; }
  .gap-8 { gap:8px; }
  .flex  { display:flex; }
  .flex-col { flex-direction:column; }
  .items-center { align-items:center; }
  .justify-between { justify-content:space-between; }
  .text-accent { color:var(--accent); }
  .text-green  { color:var(--green); }
  .text-muted  { color:var(--t2); }
  .text-small  { font-size:13px; }
  .fw-800 { font-weight:800; }
  .px-16 { padding-left:16px; padding-right:16px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── CONFIG ──────────────────────────────────────────────────────────────────
const PASSWORD = "gym2026";
const SUPABASE_URL = "https://vjcvchczbyvhweiwrunp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqY3ZjaGN6Ynl2aHdlaXdydW5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NjkzNjYsImV4cCI6MjA4NTM0NTM2Nn0.A01bxl9dNzgmeDcOV2HZIIa2pN5vhWg3q0_FhqO1R2M";

// ── SUPABASE CLIENT (lightweight) ───────────────────────────────────────────
const sb = {
  async query(table, opts = {}) {
    let url = `${SUPABASE_URL}/rest/v1/${table}?`;
    if (opts.select) url += `select=${encodeURIComponent(opts.select)}&`;
    if (opts.filter) url += `${opts.filter}&`;
    if (opts.order)  url += `order=${opts.order}&`;
    if (opts.limit)  url += `limit=${opts.limit}&`;
    const r = await fetch(url, { headers: {
      apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    }});
    return r.json();
  },
  async insert(table, data) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify(data)
    });
    return r.json();
  },
  async update(table, id, data) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
      method: 'PATCH',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify(data)
    });
    return r.json();
  },
  async delete(table, id) {
    await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
      method: 'DELETE',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
  }
};

// ── HELPERS ──────────────────────────────────────────────────────────────────
const feelingLabel = (v) => {
  if (v <= 2) return "Richtig schlecht 😵";
  if (v <= 4) return "Nicht so toll 😕";
  if (v <= 6) return "Geht so 😐";
  if (v <= 8) return "Gut drauf 💪";
  return "Absoluter Topform 🔥";
};
const feelingColor = (v) => v <= 3 ? '#EF4444' : v <= 6 ? '#EAB308' : '#22C55E';
const fmtTime = (s) => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const fmtDur = (min) => min >= 60 ? `${Math.floor(min/60)}h ${min%60}m` : `${min}m`;
const fmtVol = (kg) => kg >= 1000 ? `${(kg/1000).toFixed(1)}t` : `${Math.round(kg)}`;

// ── ESTIMATE WORKOUT DURATION ────────────────────────────────────────────────
function estimateDuration(planExercises) {
  // ~45s per set, rest time per exercise, 10s transition
  let total = 0;
  planExercises.forEach(ex => {
    const sets = ex.target_sets || 3;
    const rest = ex.rest_seconds || 90;
    const setTime = sets * 45;
    const restTime = (sets - 1) * rest;
    total += setTime + restTime + 15; // 15s transition
  });
  return Math.ceil(total / 60);
}

  return (

      <div className="lock-form">

          value={pw} onChange={e => setPw(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && check()} autoFocus />
        {err && <div className="lock-error">Falsches Passwort</div>}
        <button className="btn btn-primary" onClick={check}>Öffnen</button>

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function Dashboard({ onStartWorkout, recentSessions, plans }) {
  const today = new Date();
  const dayNames = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  const todayNum = today.getDay(); // 0=So

  // find plan for today (weekdays: 0=So,1=Mo,...,6=Sa → DB: 1=Mo...7=So)
  const dbDay = todayNum === 0 ? 7 : todayNum;
  const todayPlan = plans.find(p => p.weekdays && p.weekdays.includes(dbDay));

  const last7 = recentSessions.slice(0, 7).reverse();
  const maxVol = Math.max(...last7.map(s => s.total_volume_kg || 0), 1);

  const weekVolume = recentSessions
    .filter(s => {
      const d = new Date(s.started_at);
      const diff = (today - d) / 86400000;
      return diff < 7;
    })
    .reduce((sum, s) => sum + (s.total_volume_kg || 0), 0);

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="text-small text-muted">{today.toLocaleDateString('de-AT', { weekday:'long', day:'numeric', month:'long' })}</div>
          <div className="section-title">Guten Morgen 💪</div>
        </div>
      </div>

      {todayPlan ? (
        <div className="dash-today">
          <div className="dash-today-label">Heute geplant</div>
          <div className="dash-today-plan">{todayPlan.name}</div>
          <div className="dash-today-meta">
            {todayPlan.exercise_count || '?'} Übungen · ca. {fmtDur(todayPlan.est_duration || 60)}
          </div>
          <button className="btn btn-primary mt-12" onClick={() => onStartWorkout(todayPlan)}>
            Workout starten →
          </button>
        </div>
      ) : (
        <div className="dash-today">
          <div className="dash-today-label">Kein Training heute</div>
          <div className="dash-today-plan">Ruhetag</div>
        </div>
      )}

      <div className="stats-row">
        <div className="stat-card">
          <div className="stat-val stat-accent">{Math.round(weekVolume / 1000 * 10) / 10}t</div>
          <div className="stat-lbl">Volumen diese Woche</div>
        </div>
        <div className="stat-card">
          <div className="stat-val">{recentSessions.length}</div>
          <div className="stat-lbl">Sessions gesamt</div>
          <div className="stat-sub">letzte 30 Tage</div>
        </div>
      </div>

      {last7.length > 0 && (
        <div className="card">
          <div className="card-title">Volumen – letzte 7 Sessions</div>
          <div className="chart-bar-row">
            {last7.map((s, i) => (
              <div key={i} className={`chart-bar${i===last7.length-1?' accent':''}`}
                style={{height: `${Math.max(8, ((s.total_volume_kg||0)/maxVol)*80)}px`}} />
            ))}
          </div>
          <div className="chart-labels">
            {last7.map((s, i) => (
              <div key={i} className="chart-lbl">
                {new Date(s.started_at).toLocaleDateString('de',{weekday:'short'}).slice(0,2)}
              </div>
            ))}
          </div>
        </div>
      )}

      {recentSessions[0] && (
        <div className="card">
          <div className="card-title">Letzte Session</div>
          <div className="flex justify-between items-center">
            <div>
              <div className="fw-800" style={{fontSize:18}}>{recentSessions[0].plan_name || 'Workout'}</div>
              <div className="text-small text-muted mt-8">
                {new Date(recentSessions[0].started_at).toLocaleDateString('de-AT', {day:'numeric', month:'short'})}
                {' · '}{Math.round(recentSessions[0].duration_minutes || 0)} Min
                {' · '}{fmtVol(recentSessions[0].total_volume_kg || 0)} kg
              </div>
            </div>
            <div style={{fontSize:28, fontWeight:800, color: feelingColor(recentSessions[0].feeling_score)}}>
              {recentSessions[0].feeling_score}/10

  );

      <div className="text-small text-muted px-16 mb-12">{filtered.length} Übungen</div>

        onChange={e => setScore(+e.target.value)} />

      <div className="feeling-note-label">Notiz (optional)</div>
      <textarea className="feeling-note" rows={3} value={note}
        onChange={e => setNote(e.target.value)}

}

// ── ACTIVE WORKOUT ─────────────────────────────────────────────────────────────
function ActiveWorkout({ plan, sessionId, feelingScore, exercises, onFinish }) {
  const planExs   = plan.exercises || [];
  const [exIdx, setExIdx]     = useState(0);
  const [setNum, setSetNum]   = useState(1);
  const [weight, setWeight]   = useState(null);
  const [reps, setReps]       = useState(null);
  const [loggedSets, setLogged] = useState([]); // {exercise_id, set_number, weight_kg, reps}
  const [timerSec, setTimerSec] = useState(null);
  const [timerRunning, setTimerRunning] = useState(false);
  const [startTime]           = useState(Date.now());
  const [fitnessScore, setFitnessScore] = useState(null);
  const timerRef              = useRef(null);

  const currPlanEx = planExs[exIdx];
  const currEx     = exercises.find(e => e.id === currPlanEx?.exercise_id);
  const step       = currEx?.weight_step || 2.5;

  // init weight for current exercise
  useEffect(() => {
    if (!currEx) return;
    const lastForEx = [...loggedSets].reverse().find(s => s.exercise_id === currEx.id);
    const suggestion = lastForEx ? lastForEx.weight_kg : (currPlanEx.start_weight || 20);
    setWeight(suggestion);
    setReps(currPlanEx.target_reps || 10);
  }, [exIdx]);

  // Rest timer
  useEffect(() => {
    if (timerRunning && timerSec > 0) {
      timerRef.current = setTimeout(() => setTimerSec(s => s-1), 1000);
    } else if (timerRunning && timerSec === 0) {
      setTimerRunning(false);
    }
    return () => clearTimeout(timerRef.current);
  }, [timerRunning, timerSec]);

  const startTimer = () => {
    setTimerSec(currPlanEx?.rest_seconds || 90);
    setTimerRunning(true);
  };

  const totalSets  = planExs.reduce((s,e) => s + (e.target_sets||3), 0);
  const doneSets   = loggedSets.length;
  const elapsed    = Math.floor((Date.now() - startTime) / 60000);
  const volume     = loggedSets.reduce((s,l) => s + l.weight_kg * l.reps, 0);

  // After first set: calculate fitness score
  const calcFitnessScore = (w, r, targetW, feeling) => {
    const ratio = targetW > 0 ? (w * r) / (targetW * (currPlanEx?.target_reps||10)) : 1;
    const feelingFactor = feeling <= 4 ? 0.85 : feeling >= 8 ? 1.1 : 1.0;
    return Math.min(100, Math.round(ratio * feelingFactor * 100));
  };

  const logSet = async () => {
    if (weight === null || reps === null) return;
    const setData = { session_id: sessionId, exercise_id: currEx.id,
      plan_exercise_id: currPlanEx.id, set_number: setNum,
      weight_kg: weight, reps: reps, target_reps: currPlanEx.target_reps, is_warmup: false };
    await sb.insert('gt_sets', setData);
    const newLogged = [...loggedSets, setData];
    setLogged(newLogged);

    // fitness score after first set of first exercise
    if (exIdx === 0 && setNum === 1 && !fitnessScore) {
      const suggestion = currPlanEx.start_weight || 20;
      const score = calcFitnessScore(weight, reps, suggestion, feelingScore);
      setFitnessScore(score);
      await sb.update('gt_sessions', sessionId, { fitness_score: score });
    }

    const totalForThisEx = currPlanEx.target_sets || 3;
    if (setNum < totalForThisEx) {
      setSetNum(s => s+1);
      startTimer();
    } else {
      // Next exercise
      if (exIdx < planExs.length - 1) {
        setExIdx(i => i+1);
        setSetNum(1);
        startTimer();
      } else {
        // Done!
        await sb.update('gt_sessions', sessionId, {
          ended_at: new Date().toISOString(),
          total_volume_kg: newLogged.reduce((s,l) => s + l.weight_kg * l.reps, 0)
        });
        onFinish(newLogged);
      }
    }
  };

  const skipExercise = () => {
    if (exIdx < planExs.length - 1) { setExIdx(i=>i+1); setSetNum(1); }
  };

  if (!currEx) return <div className="empty"><div className="empty-text">Plan hat keine Übungen</div></div>;

  const repOptions = [6,7,8,9,10,11,12,15,20];

  return (
    <div>
      {/* Volume Header */}
      <div className="workout-header">
        <div className="workout-vol">Gesamtvolumen</div>
        <div>
          <span className="workout-vol-num">{Math.round(volume)}</span>
          <span className="workout-vol-unit">kg</span>
        </div>
        <div className="workout-meta-row">
          <div className="workout-meta-item">
            <div className="workout-meta-val">{elapsed}m</div>
            <div className="workout-meta-lbl">Zeit</div>
          </div>
          <div className="workout-meta-item">
            <div className="workout-meta-val">{doneSets}/{totalSets}</div>
            <div className="workout-meta-lbl">Sätze</div>
          </div>
          <div className="workout-meta-item">
            <div className="workout-meta-val" style={{color: feelingColor(feelingScore)}}>{feelingScore}/10</div>
            <div className="workout-meta-lbl">Feeling</div>
          </div>
          {fitnessScore && (
            <div className="workout-meta-item">
              <div className="workout-meta-val" style={{color:'var(--accent)'}}>{fitnessScore}%</div>
              <div className="workout-meta-lbl">Fitness</div>
            </div>
          )}
        </div>
      </div>

      {/* Progress */}
      <div className="workout-progress" style={{padding:'12px 0 0'}}>
        <div className="progress-label">
          <span>Übung {exIdx+1} von {planExs.length}</span>
          <span>{doneSets} Sätze erledigt</span>
        </div>
        <div className="progress-bar-bg">
          <div className="progress-bar-fill" style={{width:`${(doneSets/totalSets)*100}%`}} />
        </div>
      </div>

      {/* Fitness Score Banner */}
      {fitnessScore !== null && (
        <div style={{background: fitnessScore >= 90 ? 'var(--green)' : fitnessScore >= 70 ? 'var(--accent)' : 'var(--yellow)',
          margin:'12px 16px', borderRadius:'var(--radius)', padding:'12px 16px', color: fitnessScore < 90 ? '#fff' : '#000'}}>
          <div style={{fontSize:13, fontWeight:700, opacity:.8}}>HEUTE FITNESS-SCORE</div>
          <div style={{fontSize:32, fontWeight:900, letterSpacing:-1}}>{fitnessScore}%</div>
          <div style={{fontSize:14, marginTop:2}}>
            {fitnessScore >= 90 ? '🔥 Absoluter Topform – gib alles!' :
             fitnessScore >= 70 ? '💪 Guter Tag – normales Training' :
             '😕 Ruhiger Tag – Gewichte etwas reduziert'}
          </div>
        </div>
      )}

      {/* Current Exercise */}
      <div className="current-exercise">
        <div className="curr-ex-label">Jetzt · Satz {setNum} von {currPlanEx.target_sets||3}</div>
        <div className="curr-ex-name">{currEx.name}</div>
        <div className="curr-ex-muscles">
          <span className="muscle-badge">{currEx.primary_muscle_name}</span>
          {currEx.equipment_name && <span className="muscle-badge">{currEx.equipment_name}</span>}
        </div>
        {currEx.notes && <div style={{fontSize:13, color:'var(--t2)', marginTop:8}}>{currEx.notes}</div>}
      </div>

      {/* Weight Control */}
      <div className="weight-control">
        <div className="card-title">Gewicht</div>
        <div className="weight-row">
          <button className="weight-btn weight-minus" onClick={() => setWeight(w => Math.max(0, Math.round((w-step)*10)/10))}>−</button>
          <div className="weight-display">
            <div className="weight-val">{weight ?? '—'}</div>
            <div className="weight-unit">kg</div>
            <div className="weight-suggestion">Schritt: ±{step} kg</div>
          </div>
          <button className="weight-btn weight-plus" onClick={() => setWeight(w => Math.round((w+step)*10)/10)}>+</button>
        </div>
      </div>

      {/* Reps Control */}
      <div className="reps-control">
        <div className="reps-label">Wiederholungen</div>
        <div className="reps-row">
          {repOptions.map(r => (
            <button key={r} className={`rep-btn${reps===r?' active':''}`} onClick={() => setReps(r)}>{r}</button>
          ))}
          <button className={`rep-btn${!repOptions.includes(reps)?' active':''}`}
            onClick={() => { const v=prompt('Wiederholungen:'); if(v) setReps(+v); }}>…</button>
        </div>
      </div>

      {/* Timer */}
      {timerSec !== null && (
        <div className="timer-card">
          <div className="timer-label">Pause</div>
          <div className={`timer-val${timerRunning?' timer-active':' timer-done'}`}>{fmtTime(timerSec)}</div>
          <div className="timer-row">
            <button className="btn btn-secondary btn-sm" style={{flex:1}}
              onClick={() => { setTimerSec(s => Math.max(0,s-15)); }}>−15s</button>
            <button className="btn btn-secondary btn-sm" style={{flex:1}}
              onClick={() => setTimerRunning(r => !r)}>
              {timerRunning ? '⏸ Pause' : '▶ Weiter'}
            </button>
            <button className="btn btn-secondary btn-sm" style={{flex:1}}
              onClick={() => { setTimerSec(null); setTimerRunning(false); }}>✕</button>
          </div>
        </div>
      )}

      {/* Log Button */}
      <div className="px-16">
        <button className="btn btn-green" onClick={logSet} style={{fontSize:20, padding:'20px'}}>
          ✓ Satz {setNum} loggen · {weight}kg × {reps}
        </button>
      </div>

      {/* Next exercise preview */}
      {exIdx < planExs.length - 1 && (
        <div className="card" style={{marginTop:12}}>
          <div className="card-title">Als nächstes</div>
          <div style={{fontSize:16, fontWeight:600}}>
            {exercises.find(e => e.id === planExs[exIdx+1]?.exercise_id)?.name || '—'}
          </div>
          <div style={{fontSize:13, color:'var(--t2)', marginTop:4}}>
            {planExs[exIdx+1]?.target_sets}×{planExs[exIdx+1]?.target_reps} Wdh.
          </div>
        </div>
      )}

      <div className="px-16 mt-12">
        <button className="btn btn-ghost btn-sm" onClick={skipExercise}>Übung überspringen →</button>
      </div>
      <div className="px-16 mt-8" style={{paddingBottom:24}}>
        <button className="btn btn-danger btn-sm" onClick={async () => {
          await sb.update('gt_sessions', sessionId, { ended_at: new Date().toISOString() });
          onFinish(loggedSets);
        }}>Workout beenden</button>
      </div>
    </div>
  );
}

// ── WORKOUT WRAPPER (feeling → active) ───────────────────────────────────────
function WorkoutScreen({ plan, exercises, onFinish, activeSession, setActiveSession }) {
  const [phase, setPhase] = useState(activeSession ? 'active' : (plan ? 'feeling' : 'noPlan'));
  const [sessionId, setSessionId] = useState(activeSession?.id || null);
  const [feelingScore, setFeelingScore] = useState(activeSession?.feeling_score || 7);

  const handleFeelingDone = async (score, note) => {
    const [sess] = await sb.insert('gt_sessions', {
      plan_id: plan.id, feeling_score: score, feeling_note: note,
      started_at: new Date().toISOString()
    });
    setSessionId(sess.id);
    setFeelingScore(score);
    setActiveSession({ ...sess, plan });
    setPhase('active');
  };

  if (phase === 'noPlan') return (
    <div className="empty">
      <div className="empty-icon">▶️</div>
      <div className="empty-text">Kein Plan ausgewählt</div>
      <div className="empty-sub">Geh zu "Pläne" und starte ein Workout</div>
    </div>
  );

  if (phase === 'feeling') return <FeelingScreen plan={plan} onDone={handleFeelingDone} />;

  return (
    <ActiveWorkout plan={plan} sessionId={sessionId} feelingScore={feelingScore}
      exercises={exercises}
      onFinish={(sets) => { setActiveSession(null); onFinish(sets); }} />
  );
}

      filter: `session_id=eq.${session.id}`,
      order: 'exercise_id,set_number'
    }).then(setSets);

    <div>

              {new Date(session.started_at).toLocaleDateString('de-AT', {weekday:'long', day:'numeric', month:'long'})}

            <div style={{fontSize:20, fontWeight:800, marginTop:4}}>{fmtVol(session.total_volume_kg||0)} kg Volumen</div>

          <div style={{textAlign:'right'}}>
            <div style={{fontSize:28, fontWeight:900, color: feelingColor(session.feeling_score)}}>{session.feeling_score}/10</div>
            <div style={{fontSize:13, color:'var(--t2)'}}>Feeling</div>
          </div>
        </div>
        <div style={{display:'flex', gap:16}}>
          <div><div style={{fontSize:18,fontWeight:700}}>{Math.round(session.duration_minutes||0)}m</div><div style={{fontSize:12,color:'var(--t2)'}}>Dauer</div></div>
          <div><div style={{fontSize:18,fontWeight:700}}>{session.total_sets||0}</div><div style={{fontSize:12,color:'var(--t2)'}}>Sätze</div></div>
          {session.fitness_score && <div><div style={{fontSize:18,fontWeight:700,color:'var(--accent)'}}>{session.fitness_score}%</div><div style={{fontSize:12,color:'var(--t2)'}}>Fitness</div></div>}
        </div>

          <table className="sets-table">

              {exSets.map((s, i) => (

                  <td style={{color:'var(--t2)'}}>{s.set_number}</td>

                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ))}
    </div>

}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App() {
  const [unlocked, setUnlocked]           = useState(false);
  const [tab, setTab]                     = useState('dashboard');
  const [activeSession, setActiveSession] = useState(null);
  const [activePlan, setActivePlan]       = useState(null);

  // Data
  const [exercises, setExercises]         = useState([]);
  const [muscleGroups, setMuscleGroups]   = useState([]);
  const [equipmentTypes, setEquipTypes]   = useState([]);
  const [plans, setPlans]                 = useState([]);
  const [sessions, setSessions]           = useState([]);
  const [lastWeights, setLastWeights]     = useState({});
  const [prs, setPrs]                     = useState({});

  useEffect(() => {
    if (!unlocked) return;
    loadData();
  }, [unlocked]);

  const loadData = async () => {
    const [exs, mgs, eqs, pls, sess, lw, prData] = await Promise.all([
      sb.query('gt_exercises', { select:'id,name,equipment_type_id,primary_muscle_id,secondary_muscle_id,weight_step,is_custom,notes,gt_muscle_groups!primary_muscle_id(name),gt_equipment_types(name)', order:'name' }),
      sb.query('gt_muscle_groups', { order:'sort_order' }),
      sb.query('gt_equipment_types', { order:'sort_order' }),
      sb.query('gt_plans', { select:'*,gt_plan_exercises(id,exercise_id,target_sets,target_reps,rest_seconds,start_weight,notes,sort_order,gt_exercises(name,weight_step,primary_muscle_id,gt_muscle_groups!primary_muscle_id(name)))', order:'sort_order' }),
      sb.query('gt_session_overview', { order:'started_at.desc', limit:50 }),
      sb.query('gt_last_set_per_exercise', { select:'*' }),
      sb.query('gt_personal_records', { select:'exercise_id,weight_kg,reps,one_rm_est' }),
    ]);

    // Flatten exercises with joined names
    const exFlat = (exs||[]).map(e => ({
      ...e,
      primary_muscle_name: e.gt_muscle_groups?.name || '',
      equipment_name: e.gt_equipment_types?.name || '',
    }));
    setExercises(exFlat);
    setMuscleGroups(mgs||[]);
    setEquipTypes(eqs||[]);

    // Flatten plans with exercises
    const plFlat = (pls||[]).map(p => ({
      ...p,
      exercises: (p.gt_plan_exercises||[])
        .sort((a,b) => a.sort_order - b.sort_order)
        .map(pe => ({
          ...pe,
          exercise_name: pe.gt_exercises?.name,
          weight_step: pe.gt_exercises?.weight_step,
        })),
      est_duration: estimateDuration(p.gt_plan_exercises||[]),
      exercise_count: (p.gt_plan_exercises||[]).length,
    }));
    setPlans(plFlat);
    setSessions(sess||[]);

    const lwMap = {};
    (lw||[]).forEach(l => { lwMap[l.exercise_id] = l; });
    setLastWeights(lwMap);

    const prMap = {};
    (prData||[]).forEach(p => { prMap[p.exercise_id] = p; });
    setPrs(prMap);
  };

  const startWorkout = (plan) => {
    setActivePlan(plan);
    setTab('workout');
  };

  const finishWorkout = () => {
    setActiveSession(null);
    setActivePlan(null);
    loadData();
    setTab('history');
  };

  if (!unlocked) return <LockScreen onUnlock={() => setUnlocked(true)} />;

  const renderTab = () => {
    switch(tab) {
      case 'dashboard': return <Dashboard onStartWorkout={startWorkout} recentSessions={sessions} plans={plans} />;
      case 'workout':   return <WorkoutScreen plan={activePlan} exercises={exercises}
        onFinish={finishWorkout} activeSession={activeSession} setActiveSession={setActiveSession} />;
      case 'plans':     return <Plans plans={plans} exercises={exercises} muscleGroups={muscleGroups}
        equipmentTypes={equipmentTypes} onStartWorkout={startWorkout} />;
      case 'exercises': return <ExerciseLibrary exercises={exercises} muscleGroups={muscleGroups}
        equipmentTypes={equipmentTypes} lastWeights={lastWeights} prs={prs} />;
      case 'history':   return <History sessions={sessions} exercises={exercises} />;
      default: return null;
    }
  };

  return (
    <div className="app">
      {renderTab()}
      <BottomNav tab={tab} setTab={setTab} activeSession={activeSession} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
