<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mexicano — Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="live-mexicano.css">
</head>
<body>
<div class="container">

<!-- OFFLINE -->
<div id="offlineWarning">⚠️ Offline-Modus · Daten aus Backup · Wird synchronisiert sobald online</div>

<!-- HEADER -->
<header class="anim-in" style="background:var(--header-bg);margin:0 -18px;padding:16px 18px;border-radius:0 0 20px 20px;display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;align-items:center;gap:10px">
        <svg width="40" height="40" viewBox="0 0 200 200"><defs><radialGradient id="bg" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#1e3a6e"/><stop offset="100%" stop-color="#0f172a"/></radialGradient><linearGradient id="rk" x1="30%" y1="0%" x2="70%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient><linearGradient id="an" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#93c5fd"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="3"/></filter><clipPath id="rc"><ellipse cx="100" cy="88" rx="34" ry="38"/></clipPath></defs><circle cx="100" cy="100" r="96" fill="url(#bg)"/><ellipse cx="100" cy="88" rx="34" ry="38" fill="url(#rk)" stroke="#60a5fa" stroke-width="1.5" transform="rotate(-4 100 88)"/><ellipse cx="100" cy="88" rx="27" ry="31" fill="#1e3a6e" opacity=".6" transform="rotate(-4 100 88)"/><g clip-path="url(#rc)" opacity=".35" stroke="#93c5fd" stroke-width=".8" fill="none"><line x1="82" y1="50" x2="82" y2="126"/><line x1="100" y1="50" x2="100" y2="126"/><line x1="118" y1="50" x2="118" y2="126"/><line x1="66" y1="88" x2="134" y2="88"/><line x1="66" y1="108" x2="134" y2="108"/></g><rect x="95" y="124" width="10" height="36" rx="4" fill="#1d4ed8" stroke="#60a5fa"/><rect x="93" y="158" width="14" height="5" rx="2.5" fill="#2563eb" stroke="#60a5fa"/><path d="M100 52 L100 36" stroke="url(#an)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#gl)"/><path d="M100 36 C98 32 93 28 88 22" stroke="url(#an)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#gl)"/><path d="M88 22 C85 18 82 15 80 11" stroke="url(#an)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#gl)"/><path d="M100 36 C102 32 107 28 112 22" stroke="url(#an)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#gl)"/><path d="M112 22 C115 18 118 15 120 11" stroke="url(#an)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#gl)"/><circle cx="124" cy="72" r="6" fill="#fbbf24" stroke="#f59e0b"/></svg>
        <div>
            <div style="font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase">Padel Hirsch</div>
            <h1 id="tournamentTitle" style="font-size:18px;font-weight:900;color:var(--header-text);text-transform:uppercase;line-height:1">Lade...</h1>
        </div>
    </div>
    <div style="display:flex;gap:8px">
        <button id="refreshBtn" onclick="manualRefresh()" class="header-btn" title="Aktualisieren"><span id="refreshIcon">🔄</span></button>
        <button id="adminBtn" onclick="openAdminSheet()" class="header-btn">⚙️ Admin</button>
    </div>
</header>

<!-- ZEIT-BANNER -->
<div id="timeBanner" class="time-banner anim-in"></div>

<!-- FOKUS -->
<div style="margin-top:16px" class="anim-in">
    <label style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;display:block">🎯 Fokus wählen</label>
    <select id="playerFocus" class="focus-select" onchange="saveFocus()"><option value="">Alle anzeigen</option></select>
</div>

<!-- MATCHES -->
<div id="matchesArea"></div>

<!-- RANKING -->
<div class="mt-8 anim-in">
    <h2 style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">🏆 Rangliste</h2>
    <div class="card-solid">
        <table style="width:100%;border-collapse:collapse">
            <thead><tr style="border-bottom:1.5px solid var(--border)">
                <th style="padding:12px 16px;text-align:left;font-size:10px;font-weight:800;color:var(--text-muted);text-transform:uppercase">#</th>
                <th style="padding:12px 10px;text-align:left;font-size:10px;font-weight:800;color:var(--text-muted);text-transform:uppercase">Spieler:in</th>
                <th style="padding:12px 10px;text-align:center;font-size:10px;font-weight:800;color:var(--text-muted);text-transform:uppercase">S/N</th>
                <th style="padding:12px 10px;text-align:center;font-size:10px;font-weight:800;color:var(--text-muted);text-transform:uppercase">Pkt</th>
                <th style="padding:12px 16px;text-align:center;font-size:10px;font-weight:800;color:var(--text-muted);text-transform:uppercase">Diff</th>
            </tr></thead>
            <tbody id="rankingTable"></tbody>
        </table>
    </div>
</div>

<!-- HISTORY -->
<div id="historyArea"></div>

<!-- THEMES -->
<div class="mt-8 anim-in">
    <h2 style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">🎨 Design wählen</h2>
    <div id="themeButtons" style="display:flex;flex-wrap:wrap;gap:8px"></div>
</div>

</div>

<!-- FLOATING SAVE -->
<div id="floatingBtn" onclick="saveAllDirty()">💾 Scores speichern</div>

<!-- DRAG GHOST -->
<div id="dragGhost"></div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- ADMIN SHEET -->
<div id="adminSheet" class="sheet-overlay hidden" onclick="if(event.target===this)closeAdminSheet()">
    <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <div class="sheet-title">⚙️ Admin</div>
        <div class="sheet-sub">Mexicano-Turnierverwaltung</div>
        <div id="adminContent"></div>
    </div>
</div>

<script src="live-mexicano.js"></script>
</body>
</html>
